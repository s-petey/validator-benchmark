name: Dependabot Benchmark Runner

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark for updated packages
        run: |
          # Get updated dependency names
          UPDATED_PACKAGES="${{ steps.metadata.outputs.dependency-names }}"
          echo "Updated packages: $UPDATED_PACKAGES"

          # Replace commas with spaces
          PACKAGES_ARGS=$(echo $UPDATED_PACKAGES | tr ',' ' ')

          echo "Running CLI with: $PACKAGES_ARGS"

          # Run the benchmark history command, passing down the package names
          pnpm run bench:history -- --packages $PACKAGES_ARGS

      - name: Commit updated history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update benchmark history for new versions"
          file_pattern: "apps/web/src/data/history/*.json"
